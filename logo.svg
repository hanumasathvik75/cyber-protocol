<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#090a10" />
    </radialGradient>

    <!-- Shield Primary Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- Inner Core Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
    </filter>
  </defs>

  <!-- Dark Rounded App Icon Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="2" />

  <!-- Ambient Shield Glow -->
  <path d="M256 70 L390 125 C390 270, 290 380, 256 425 C222 380, 122 270, 122 125 Z" 
        fill="#38bdf8" opacity="0.25" filter="url(#softGlow)" />

  <!-- Outer Cyber Shield Bevel -->
  <path d="M256 78 L384 130 C384 265, 288 370, 256 414 C224 370, 128 265, 128 130 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)" />

  <!-- Inner Dark Shield Plate -->
  <path d="M256 98 L364 142 C364 256, 282 346, 256 384 C230 346, 148 256, 148 142 Z" 
        fill="#0d111c" stroke="rgba(56, 189, 248, 0.4)" stroke-width="3" />

  <!-- Cyber Neural / Circuit Traces -->
  <path d="M256 120 L256 220" stroke="url(#neonGlow)" stroke-width="4" stroke-linecap="round" />
  <path d="M210 170 L256 200 L302 170" fill="none" stroke="url(#neonGlow)" stroke-width="3" stroke-linecap="round" opacity="0.7" />
  <circle cx="210" cy="170" r="5" fill="#38bdf8" />
  <circle cx="302" cy="170" r="5" fill="#a855f7" />

  <!-- Digital Lock Shackle -->
  <path d="M226 226 V200 C226 183.4, 239.4 170, 256 170 C272.6 170, 286 183.4, 286 200 V226" 
        fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" />

  <!-- Digital Lock Body (Angular Fortress) -->
  <rect x="210" y="226" width="92" height="78" rx="16" fill="url(#coreGrad)" stroke="#38bdf8" stroke-width="3" />
  
  <!-- Lock Core Keyhole & Pulse Node -->
  <circle cx="256" cy="256" r="10" fill="#38bdf8" filter="url(#glow)" />
  <path d="M252 262 L248 284 H264 L260 262 Z" fill="#38bdf8" />

  <!-- Lower Safety Halo -->
  <path d="M190 320 C220 345, 292 345, 322 320" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="4" stroke-linecap="round" />
</svg>